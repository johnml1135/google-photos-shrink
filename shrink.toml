[photos]
short_edge = 1500
format = "avif"
quality = 60

[videos]
# Videos are ~2% of a library's items and ~45% of its encoded bytes, so this
# block decides the total more than anything in [photos] does.
#
# Measured on five real clips from this library, 15s each, as a share of the
# 1.84 GB the 174 videos occupy at the settings below. x265's own default CRF
# is 28 (x264's is 23 -- they are not the same scale), and +6 CRF roughly
# halves the size.
#
# The encoder was chosen by measurement on this library, on one 52s 1080p phone
# video whose source is 24.4 MB:
#
#   encoder            setting      time    output   note
#   libx265            preset slow  never   --       wedged ffmpeg on this machine
#   hevc_nvenc (GPU)   cq 28         14s    22.8 MB  barely smaller than the source
#   hevc_nvenc (GPU)   cq 36         14s     9.4 MB
#   libsvtav1          crf 32        36s    13.4 MB
#   libsvtav1          crf 36        36s    10.7 MB  <- chosen
#   libsvtav1          crf 40        39s     8.3 MB
#   libsvtav1          crf 44        39s     6.6 MB
#
# AV1 wins on bytes at every comparable quality, and SVT-AV1 preset 8 runs at
# about 1.4x realtime here -- roughly 70x faster than libx265 managed on the
# same machine, which never finished a file at all. AV1 is newer than HEVC, so
# a very old device may not play it directly; Google Photos stores and
# transcodes it fine.
#
# crf is AV1's 0-63 scale, not x265's: 36 here is not 36 there. AV1 crf 36 is
# roughly HEVC cq 30-32 in quality.
#
# Changing crf or the edges makes existing video outputs stale. Re-encode just
# those with:  tools/takeout_encode.py <root> --kinds video --no-resume
long_edge = 1920
short_edge = 1080
codec = "av1"
encoder = "libsvtav1"
crf = 36
preset = "8"
max_fps = 0
audio_bitrate_kbps = 96

[tools]
# The full build, for libsvtav1: gyan's "essentials" build does not carry it.
ffmpeg = ".cache/tools/ff-full/ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe"
ffprobe = ".cache/tools/ff-full/ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe"

[google]
cookies_file = ".photos-shrink/cookies.txt"
browser_profile = ".photos-shrink/browser"
browser_channel = "chrome"
browser_headless = true
account_index = 1
session_refresh_seconds = 300

[run]
# Two different kinds of thing, deliberately kept in two places:
#   work_dir  private credentials -- cookies, the API token and client. Small,
#             never leaves this machine, belongs beside the repo.
#   data_dir  the Takeout work -- encoded outputs, encoded.csv, mirror.csv and
#             the upload journal. Gigabytes; lives wherever the export does.
# When they were one setting, every data default pointed into the repo, and an
# encode meant to resume the library on G: re-encoded all of it here instead.
# Leave data_dir empty to keep both in work_dir.
work_dir = ".photos-shrink"
data_dir = "G:/takeout-work"
pause_seconds = 10
minimum_savings_percent = 20
# ffmpeg threads per video. This machine has 20 logical processors; at 2 a
# 1080p CRF 30 encode crawls, and videos run one at a time anyway.
threads = 12
# Videos encode one at a time per worker. SVT-AV1 uses about two cores per
# encode whatever thread count it is given, so four at a time is what reaches
# eight of this machine's twenty logical processors.
encode_workers = 4
# Google refuses to add an item to a shared album, so an original that lives
# in one cannot be replaced without dropping the photo out of an album other
# people see. With this off, 145 such items failed the same album write on
# every run; on, they are refused and keep their originals.
skip_shared = true
skip_non_space_consuming = true
photos_only = false

[exclude]
timezone = "America/New_York"
date_ranges = []
name_globs = []
