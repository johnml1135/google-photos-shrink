[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-shrink"
version = "0.1.0"
description = "Safely shrink a Google Photos library with resumable replacement state"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.3",
  "pillow-heif>=1.0",
  "filelock>=3.12",
  "gpwc @ git+https://github.com/xob0t/google_photos_web_client.git@651aa268d50529cb6128c8a42c9cd4ce668f2189",
  "playwright>=1.45",
  "requests>=2.31",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
photos-shrink = "photos_shrink.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
