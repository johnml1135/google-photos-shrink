[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photos-shrink"
version = "0.1.0"
description = "Shrink a Google Photos library from a Takeout export"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=11.3",
  "pillow-heif>=1.0",
  "gpwc @ git+https://github.com/xob0t/google_photos_web_client.git@651aa268d50529cb6128c8a42c9cd4ce668f2189",
  "playwright>=1.45",
  "requests>=2.31",
  "tzdata>=2024.1",
]

[project.scripts]
photos-shrink = "photos_shrink.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep scratch and cache under .cache/ rather than scattering dot-directories
# through the repo root. Pass --basetemp only if you intend that.
cache_dir = ".cache/pytest"
tmp_path_retention_policy = "failed"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
